name: Build Windows Installer

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  build-windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      WINDOWS_CODESIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}
      WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
      WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-windows-build.txt

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-windows-build.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve build version
        id: version
        shell: pwsh
        run: |
          $releaseTag = "${{ github.event.release.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            $metadata = Get-Content -LiteralPath "app_metadata.py" -Raw
            $match = [regex]::Match($metadata, 'APP_VERSION\s*=\s*"([^"]+)"')
            if (-not $match.Success) {
              throw "Unable to read APP_VERSION from app_metadata.py."
            }
            $version = $match.Groups[1].Value
          }
          else {
            $version = $releaseTag.Trim()
            if ($version.StartsWith("v")) {
              $version = $version.Substring(1)
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Align app metadata version for release builds
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $metadataPath = "app_metadata.py"
          $content = Get-Content -LiteralPath $metadataPath -Raw
          $updated = [regex]::Replace($content, 'APP_VERSION\s*=\s*"([^"]+)"', "APP_VERSION = `"$version`"", 1)
          if ($updated -eq $content) {
            throw "APP_VERSION entry was not updated in $metadataPath."
          }
          Set-Content -LiteralPath $metadataPath -Value $updated -Encoding UTF8

      - name: Remove stale installer artifacts
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "installer-output") {
            Get-ChildItem -LiteralPath "installer-output" -File -Include "CloudflareIAMExplorer-Setup-*.exe","CloudflareIAMExplorer-Portable-*.zip" -ErrorAction SilentlyContinue |
              Remove-Item -Force
          }

      - name: Build installer bundle
        shell: pwsh
        run: .\build_windows_installer.ps1

      - name: Prepare code signing certificate
        if: env.WINDOWS_CODESIGN_CERT_BASE64 != '' && env.WINDOWS_CODESIGN_CERT_PASSWORD != ''
        id: codesign
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "cloudflare-iam-explorer-codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERT_BASE64))
          "cert_path=$certPath" >> $env:GITHUB_OUTPUT

      - name: Sign packaged application with SignTool
        if: env.WINDOWS_CODESIGN_CERT_BASE64 != '' && env.WINDOWS_CODESIGN_CERT_PASSWORD != ''
        shell: pwsh
        run: |
          $timestampUrl = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_TIMESTAMP_URL)) { "http://timestamp.digicert.com" } else { $env:WINDOWS_CODESIGN_TIMESTAMP_URL }
          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) {
            throw "Could not locate signtool.exe on the GitHub Actions runner."
          }

          $targets = Get-ChildItem "dist\CloudflareIAMExplorer" -Recurse -File | Where-Object { $_.Extension -in ".exe", ".dll" }
          if (-not $targets) {
            throw "No packaged application files were found to sign."
          }

          foreach ($target in $targets) {
            & $signTool.FullName sign /f "${{ steps.codesign.outputs.cert_path }}" /p "$env:WINDOWS_CODESIGN_CERT_PASSWORD" /fd SHA256 /tr "$timestampUrl" /td SHA256 "$($target.FullName)"
            if ($LASTEXITCODE -ne 0) {
              throw "SignTool failed for $($target.FullName)."
            }
          }

      - name: Sign installer executable with SignTool
        if: env.WINDOWS_CODESIGN_CERT_BASE64 != '' && env.WINDOWS_CODESIGN_CERT_PASSWORD != ''
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installerPath = Join-Path $PWD "installer-output\CloudflareIAMExplorer-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installerPath)) {
            throw "Installer executable not found at $installerPath."
          }

          $timestampUrl = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_TIMESTAMP_URL)) { "http://timestamp.digicert.com" } else { $env:WINDOWS_CODESIGN_TIMESTAMP_URL }
          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) {
            throw "Could not locate signtool.exe on the GitHub Actions runner."
          }

          & $signTool.FullName sign /f "${{ steps.codesign.outputs.cert_path }}" /p "$env:WINDOWS_CODESIGN_CERT_PASSWORD" /fd SHA256 /tr "$timestampUrl" /td SHA256 "$installerPath"
          if ($LASTEXITCODE -ne 0) {
            throw "SignTool failed for $installerPath."
          }

      - name: Note when code signing is not configured
        if: env.WINDOWS_CODESIGN_CERT_BASE64 == '' || env.WINDOWS_CODESIGN_CERT_PASSWORD == ''
        shell: pwsh
        run: |
          Write-Host "Traditional code signing is not configured for this repository."
          Write-Host "The build will continue, but the application and installer will remain unsigned."

      - name: Create portable release zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $portablePath = "installer-output\CloudflareIAMExplorer-Portable-$version.zip"
          if (Test-Path -LiteralPath $portablePath) {
            Remove-Item -LiteralPath $portablePath -Force
          }
          Compress-Archive -Path "dist\CloudflareIAMExplorer\*" -DestinationPath $portablePath

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ steps.version.outputs.version }}
          path: |
            installer-output\CloudflareIAMExplorer-Setup-${{ steps.version.outputs.version }}.exe
            installer-output\CloudflareIAMExplorer-Portable-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Attach release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-output/CloudflareIAMExplorer-Setup-${{ steps.version.outputs.version }}.exe
            installer-output/CloudflareIAMExplorer-Portable-${{ steps.version.outputs.version }}.zip
