name: Build Windows Installer

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  build-windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-windows-build.txt

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-windows-build.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve build version
        id: version
        shell: pwsh
        run: |
          $releaseTag = "${{ github.event.release.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            $metadata = Get-Content -LiteralPath "app_metadata.py" -Raw
            $match = [regex]::Match($metadata, 'APP_VERSION\s*=\s*"([^"]+)"')
            if (-not $match.Success) {
              throw "Unable to read APP_VERSION from app_metadata.py."
            }
            $version = $match.Groups[1].Value
          }
          else {
            $version = $releaseTag.Trim()
            if ($version.StartsWith("v")) {
              $version = $version.Substring(1)
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Align app metadata version for release builds
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $metadataPath = "app_metadata.py"
          $content = Get-Content -LiteralPath $metadataPath -Raw
          $updated = [regex]::Replace($content, 'APP_VERSION\s*=\s*"([^"]+)"', "APP_VERSION = `"$version`"", 1)
          if ($updated -eq $content) {
            throw "APP_VERSION entry was not updated in $metadataPath."
          }
          Set-Content -LiteralPath $metadataPath -Value $updated -Encoding UTF8

      - name: Remove stale installer artifacts
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "installer-output") {
            Get-ChildItem -LiteralPath "installer-output" -File -Include "CloudflareIAMExplorer-Setup-*.exe","CloudflareIAMExplorer-Portable-*.zip" -ErrorAction SilentlyContinue |
              Remove-Item -Force
          }

      - name: Build installer bundle
        shell: pwsh
        run: .\build_windows_installer.ps1

      - name: Sign packaged application with Trusted Signing
        if: vars.TRUSTED_SIGNING_ENDPOINT != '' && vars.TRUSTED_SIGNING_ACCOUNT_NAME != '' && vars.TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\dist\CloudflareIAMExplorer
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: false
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Sign installer executable with Trusted Signing
        if: vars.TRUSTED_SIGNING_ENDPOINT != '' && vars.TRUSTED_SIGNING_ACCOUNT_NAME != '' && vars.TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\installer-output
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: false
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Note when Trusted Signing is not configured
        if: vars.TRUSTED_SIGNING_ENDPOINT == '' || vars.TRUSTED_SIGNING_ACCOUNT_NAME == '' || vars.TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME == '' || secrets.AZURE_TENANT_ID == '' || secrets.AZURE_CLIENT_ID == ''
        shell: pwsh
        run: |
          Write-Host "Trusted Signing is not configured for this repository."
          Write-Host "The build will continue, but the application and installer will remain unsigned."

      - name: Create portable release zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $portablePath = "installer-output\CloudflareIAMExplorer-Portable-$version.zip"
          if (Test-Path -LiteralPath $portablePath) {
            Remove-Item -LiteralPath $portablePath -Force
          }
          Compress-Archive -Path "dist\CloudflareIAMExplorer\*" -DestinationPath $portablePath

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ steps.version.outputs.version }}
          path: |
            installer-output\CloudflareIAMExplorer-Setup-${{ steps.version.outputs.version }}.exe
            installer-output\CloudflareIAMExplorer-Portable-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Attach release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-output/CloudflareIAMExplorer-Setup-${{ steps.version.outputs.version }}.exe
            installer-output/CloudflareIAMExplorer-Portable-${{ steps.version.outputs.version }}.zip
